# REINVENT 風格 GRU decoder-only 語言模型 訓練配置檔案

# 資料設定
data:
  train_csv: './data/processed/train_small_processed.csv'
  train_split: 0.9
  max_length: 50
  # 訓練時是否每次取用都用 RDKit 重新隨機化 SMILES 書寫法 (SMILES enumeration)。
  # 這是 REINVENT 系列論文 (Bjerrum 2017; Arus-Pous et al. 2019) 驗證過有效的資料增強，
  # 能增加生成分子的多樣性、降低對特定 canonical 寫法的過擬合。驗證集不受此設定影響，
  # 固定用 canonical 寫法以確保 val loss/perplexity 每個 epoch 可以互相比較。
  randomize_smiles: true

# 模型架構
model:
  embedding_dim: 256
  hidden_dim: 512
  num_layers: 3
  dropout: 0.1

# 訓練參數
training:
  num_epochs: 50
  batch_size: 128
  learning_rate: 0.001
  num_workers: 0
  grad_clip_max_norm: 1.0

# 驗證設定
validation:
  num_sample: 10       # 每個 epoch 生成幾個分子來算 validity rate

# 檢查點設定
checkpoint:
  save_dir: './checkpoints/reinvent_small'
  save_interval: 5
  load_from: null      # 設定 .pt 檔案路徑會先載入該模型權重繼續訓練/微調
                        # （會自動嘗試載入同目錄下的 tokenizer.json，確保詞彙表一致）

# 設備設定
device:
  use_cuda: true
  # GPU 上是否額外開啟 cuDNN deterministic 模式（關掉 benchmark 自動調參 +
  # torch.use_deterministic_algorithms(warn_only=True)），讓相同 seed 重跑訓練時
  # GPU 上的結果也能盡量 bit-exact 重現。預設開啟；已知限制：極少數 cuDNN 版本下
  # RNN backward 仍可能無法保證 100% bit-exact，這屬於 PyTorch/cuDNN 本身的限制。
  deterministic_cuda: true

# 隨機種子：固定這個值後，訓練資料切分/洗牌、SMILES randomize 增強、模型初始化、
# dropout、RL 採樣（property_guided 開啟時）都會是同一個 seed 的 deterministic 函式，
# 重跑應該得到一致的結果（見 device.deterministic_cuda 的 GPU 限制說明）
seed: 42
