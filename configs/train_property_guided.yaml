# Property-Guided RL 訓練配置檔案
# 用法: python train.py --config configs/train_property_guided.yaml
#
# 除了原本的監督式 VAE 訓練，warmup 結束後每個 epoch 會額外：
#   1. 用目前的模型採樣一批分子，依「結構規則(filter_api)」+「性質目標(target_spec) 的
#      pareto front 排序」算 reward，做 REINFORCE 微調
#   2. 把這一輪 front 1（最好的一層）且結構合規的分子累積進 elite buffer，
#      持續用這些分子做監督式訓練，讓它們一直留在訓練資料中
#   3. 把每一輪 front 1 的分子結構與性質寫進 property_guided.front1_log_path
#      可以訓練過程中打開該 CSV 檔監看進度

# 資料設定
data:
  train_csv: './data/processed/train_small_processed.csv'
  train_split: 0.9
  max_length: 50

# 模型架構
model:
  model_type: 'gru'  # 'gru' 或 'transformer'
  embedding_dim: 256
  hidden_dim: 256
  latent_dim: 64
  num_layers: 3
  dropout: 0.1
  bidirectional: true

# 訓練參數
training:
  num_epochs: 100
  batch_size: 128
  learning_rate: 0.00035
  num_workers: 0

  # KL Annealing 設定
  kl_weight_start: 0.0
  kl_weight_end: 0.01
  kl_anneal_epochs: 50

  # 梯度裁剪
  grad_clip_max_norm: 1.0

# 驗證設定
validation:
  num_reconstruct: 10
  num_sample: 10

# 檢查點設定
checkpoint:
  save_dir: './checkpoints/property_guided'
  save_interval: 5

# 設備設定
device:
  use_cuda: true

# 隨機種子
seed: 42

# ------------------------------------------------------------------
# Property-Guided RL 訓練設定
# ------------------------------------------------------------------
property_guided:
  enabled: true

  # 生成分子時的最大序列長度，不填則沿用 data.max_length
  max_length: 50

  # 每個 RL round 取樣幾個分子 / 每個 epoch 跑幾個 RL round
  num_samples_per_round: 2048
  num_rl_rounds_per_epoch: 1

  # 前幾個 epoch 只做原本的監督式訓練，讓模型先學會基本合法的 SMILES 語法，
  # 之後才開始 RL 微調（太早開始 pareto 篩選/自我訓練意義不大甚至有害）
  warmup_epochs: 10

  # Reward 設定：無效分子 < 結構不合規 < 合規但性質差 < 合規且 pareto front 最好
  reward_invalid: -1.0
  reward_structure_fail: -0.5
  reward_pass_base: 0.0
  reward_pass_max: 1.0

  # Prior regularization 權重，防止 RL 微調時生成多樣性崩潰 (mode collapse)
  prior_kl_weight: 0.1

  # multinomial 採樣溫度，越高越隨機/多樣，越低越接近 greedy
  sampling_temperature: 1.0

  # 結構規則過濾器 (filter_api) 的參數
  structure_filter:
    max_ring_size: 8
    max_heavy_atoms: 60
    min_heavy_atoms: 2
    # forbidden_smarts:            # 不填則用內建的預設示範規則
    #   - "[N;R0]=[N;R0]=[N;R0]"

  # 分子性質目標 (target_spec)：每個性質可以是
  #   goal: maximize | minimize | range (range 需要同時給 low / high)
  target_spec:
    ClogP:
      goal: range
      low: 1.0
      high: 3.0
    SAScore:
      goal: minimize

  # Elite buffer：累積「一直合規且 front 1」的分子，持續用它們做監督式訓練
  elite_buffer:
    enabled: true
    max_size: 200
    batch_size: 32
    num_train_rounds_per_epoch: 1

  # Front 1 分子的 CSV log 路徑，不填則預設存在 checkpoint.save_dir 底下的 front1_log.csv
  front1_log_path: null
