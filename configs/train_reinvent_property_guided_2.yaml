# REINVENT 風格 GRU decoder-only 語言模型 Property-Guided RL 訓練配置檔案
# 用法: python train_reinvent.py --config configs/train_reinvent_property_guided.yaml
#
# 開啟 property_guided.enabled 後：
#   1. 訓練資料在一開始就會先用 filter_api 過濾過，只保留符合結構規則的 SMILES
#   2. 前 warmup_epochs 個 epoch 做原本的監督式訓練；warmup 結束後就完全只靠 RL 微調，
#      不再穿插任何監督式訓練
#   3. warmup 結束後每個 epoch 會額外用目前的模型採樣一批分子（從 BOS 開始自回歸生成），
#      依「結構規則(filter_api)」+「性質目標(target_spec) 的絕對 desirability」算 reward，
#      做 REINFORCE 微調（reward 完全是絕對分數，不看任何排名/歷史比較）
#   4. 通過結構規則的分子仍會被拿去更新一個「菁英 archive」，但這個 archive 純粹是事後
#      分析用的歷史紀錄（找出這個生成器最終發現哪些好分子），不影響 reward 或訓練本身；
#      每一輪 front 1（archive 內最好的一層）的分子結構與性質會寫進
#      property_guided.front1_log_path

# 資料設定
data:
  train_csv: './data/processed/train_small_processed.csv'
  train_split: 0.9
  max_length: 50
  # 訓練時是否每次取用都用 RDKit 重新隨機化 SMILES 書寫法 (SMILES enumeration)，
  # 對監督式訓練（warmup）那部分的資料有效；驗證集固定用 canonical 寫法
  randomize_smiles: true

# 模型架構
model:
  embedding_dim: 256
  hidden_dim: 512
  num_layers: 3
  dropout: 0.1

# 訓練參數
training:
  num_epochs: 100
  batch_size: 128
  learning_rate: 0.001
  num_workers: 8
  grad_clip_max_norm: 1.0

# 驗證設定
validation:
  num_sample: 10

# 檢查點設定
checkpoint:
  save_dir: './checkpoints/reinvent_property_guided_2'
  save_interval: 5
  load_from: './checkpoints/reinvent_small/best_model.pt'   # 從預訓練好的 SmilesLM 開始做 RL 微調

# 設備設定
device:
  use_cuda: true
  # GPU 上是否額外開啟 cuDNN deterministic 模式，讓相同 seed 重跑訓練時 GPU 上的
  # 結果也能盡量 bit-exact 重現（詳細說明見 configs/train_reinvent.yaml）。預設開啟。
  deterministic_cuda: true

# 隨機種子：固定這個值後，訓練資料切分/洗牌、SMILES randomize 增強、模型初始化、
# dropout、RL 採樣都會是同一個 seed 的 deterministic 函式，重跑應該得到一致的結果
# （見 device.deterministic_cuda 的 GPU 限制說明）

# 隨機種子
seed: 42

# ------------------------------------------------------------------
# Property-Guided RL 訓練設定
# ------------------------------------------------------------------
property_guided:
  enabled: true

  max_length: 50

  num_samples_per_round: 1024
  num_rl_rounds_per_epoch: 20

  # 前幾個 epoch 只做原本的監督式訓練，之後才開始 RL 微調；warmup 結束後就完全只靠
  # RL（loss_pg + prior 正則化）更新模型，不再穿插任何監督式訓練——跟 REINVENT 原版
  # （Olivecrona et al. 2017）Agent 微調階段的做法一致
  warmup_epochs: 5

  # 「菁英 archive」保留 pareto rank 前幾層（不是固定數量）的分子：每輪把通過結構檢查
  # 的分子跟這個 archive 目前保留的分子合併做一次 pareto 排序，更新 archive 內容。
  # 這個 archive 純粹是事後分析用的歷史紀錄（讓你知道這個生成器最終找到哪些好分子，
  # 見 elite_archive_log_path），完全不影響 reward 或訓練本身
  elite_archive_rank: 50

  # Reward 完全由「絕對 desirability」決定：把每個性質的 to_objective() 距離，用 RL
  # 開始時從 prior model 大量取樣算出、之後固定不變的平均值/標準差轉成 z-score
  # （z = (raw - mean_ref) / std_ref，只有比 prior model 自然產出的族群平均差的部分才
  # 開始衰減），取 exp(-max(z,0))，多個性質再用幾何平均合併成單一絕對分數（0~1）。
  # reward = reward_pass_base + (reward_pass_max - reward_pass_base) * absolute_desirability
  # 校準這個正規化基準（平均值/標準差）時，從 prior model 取樣幾個分子
  reward_normalization_num_samples: 5000

  # Reward 設定：無效分子 < 結構不合規 < 合規但性質差 < 合規且絕對 desirability 最好
  reward_invalid: -3.0
  reward_structure_fail: -1.0
  reward_pass_base: 1.0
  reward_pass_max: 3.0

  # Prior regularization 權重，防止 RL 微調時生成多樣性崩潰 (mode collapse)
  prior_kl_weight: 0.5

  # multinomial 採樣溫度，越高越隨機/多樣，越低越接近 greedy
  sampling_temperature: 1.5

  # 結構規則過濾器 (filter_api) 的參數
  structure_filter:
    max_ring_size: 8
    max_heavy_atoms: 60
    min_heavy_atoms: 2
    desired_smarts:
      - "[C](=[O])-[N]"
      - "c1ccccc1"
    require_all_desired: true

  # 分子性質目標 (target_spec)
  target_spec:
    ClogP:
      goal: maximize #range
      # low: 5.0
      # high: 6.5
    SAScore:
      goal: range
      low: 1.5
      high: 2.5
    MolWt:
      goal: range
      low: 300
      high: 470

  # Front 1 分子的 CSV log 路徑，不填則預設存在 checkpoint.save_dir 底下的 front1_log.csv
  front1_log_path: null

  # 每一輪更新完 elite_archive 之後，archive 裡目前 pareto rank 前 5 層的分子快照
  # （每次覆蓋，不留存歷史），不填則預設存在 checkpoint.save_dir 底下的
  # elite_archive_log.csv
  elite_archive_log_path: null
