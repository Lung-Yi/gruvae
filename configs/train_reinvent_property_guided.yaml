# REINVENT 風格 GRU decoder-only 語言模型 Property-Guided RL 訓練配置檔案
# 用法: python train_reinvent.py --config configs/train_reinvent_property_guided.yaml
#
# 開啟 property_guided.enabled 後：
#   1. 訓練資料在一開始就會先用 filter_api 過濾過，只保留符合結構規則的 SMILES
#   2. warmup 結束後每個 epoch 會額外用目前的模型採樣一批分子（從 BOS 開始自回歸生成），
#      依「結構規則(filter_api)」+「性質目標(target_spec) 的 pareto front 排序」算 reward，
#      做 REINFORCE 微調
#   3. 通過結構規則的分子會被拿去更新一個動態訓練池，直接同步進實際的訓練資料
#   4. 每一輪 front 1（最好的一層）的分子結構與性質會寫進 property_guided.front1_log_path

# 資料設定
data:
  train_csv: './data/processed/train_small_processed.csv'
  train_split: 0.9
  max_length: 50
  # 訓練時是否每次取用都用 RDKit 重新隨機化 SMILES 書寫法 (SMILES enumeration)，
  # 對監督式訓練那部分的資料（含動態訓練池）有效；驗證集固定用 canonical 寫法
  randomize_smiles: true

# 模型架構
model:
  embedding_dim: 256
  hidden_dim: 512
  num_layers: 3
  dropout: 0.1

# 訓練參數
training:
  num_epochs: 100
  batch_size: 128
  learning_rate: 0.001
  num_workers: 0
  grad_clip_max_norm: 1.0

# 驗證設定
validation:
  num_sample: 10

# 檢查點設定
checkpoint:
  save_dir: './checkpoints/reinvent_property_guided'
  save_interval: 5
  load_from: './checkpoints/reinvent_small/best_model.pt'   # 從預訓練好的 SmilesLM 開始做 RL 微調

# 設備設定
device:
  use_cuda: true
  # GPU 上是否額外開啟 cuDNN deterministic 模式，讓相同 seed 重跑訓練時 GPU 上的
  # 結果也能盡量 bit-exact 重現（詳細說明見 configs/train_reinvent.yaml）。預設開啟。
  deterministic_cuda: true

# 隨機種子：固定這個值後，訓練資料切分/洗牌、SMILES randomize 增強、模型初始化、
# dropout、RL 採樣都會是同一個 seed 的 deterministic 函式，重跑應該得到一致的結果
# （見 device.deterministic_cuda 的 GPU 限制說明）

# 隨機種子
seed: 42

# ------------------------------------------------------------------
# Property-Guided RL 訓練設定
# ------------------------------------------------------------------
property_guided:
  enabled: true

  max_length: 50

  num_samples_per_round: 1024
  num_rl_rounds_per_epoch: 20

  # 前幾個 epoch 只做原本的監督式訓練，之後才開始 RL 微調
  warmup_epochs: 5

  # warmup 結束、RL 開始之後，是否每個 epoch 仍要做一次監督式訓練（詳見
  # train_reinvent_property_guided.yaml 的註解）
  supervised_training_during_rl: false

  # 菁英 archive 保留 pareto rank 前幾層（不是固定數量）的分子：每輪 reward 計算時，
  # 會把通過結構檢查的分子跟這個 archive 目前保留的分子合併做 pareto 排序，用「相對於
  # 歷史最佳前緣」的名次算 reward（見 train_reinvent_property_guided.yaml 的完整說明），
  # 而不是只跟同一輪隨機抽到的分子比較
  elite_archive_rank: 10

  # reward 名次縮放曲線的指數，1.0 是線性（每階名次差距固定）。調大會放大前幾名之間
  # 的 reward 差距、壓縮後段名次的差距（見 train_reinvent_property_guided.yaml 完整說明）
  reward_scale_power: 2.0

  # 連續幾個 epoch archive 的第 archive_stagnation_watch_rank 層（預設 rank 1，也就是
  # 「front 2」）都沒變化就視為停滯，觸發清理：把 archive 清到只剩
  # rank < archive_prune_keep_rank 的分子（見 train_reinvent_property_guided.yaml
  # 完整說明），讓中段名次重新空出來競爭
  archive_stagnation_patience_epochs: 1
  archive_stagnation_watch_rank: 1
  archive_prune_keep_rank: 1

  # Reward 設定：無效分子 < 結構不合規 < 合規但性質差 < 合規且 pareto front 最好
  reward_invalid: -2.0
  reward_structure_fail: -1.0
  reward_pass_base: 1.0
  reward_pass_max: 3.0

  # Prior regularization 權重，防止 RL 微調時生成多樣性崩潰 (mode collapse)
  prior_kl_weight: 0.5

  # multinomial 採樣溫度，越高越隨機/多樣，越低越接近 greedy
  sampling_temperature: 1.5

  # 結構規則過濾器 (filter_api) 的參數
  structure_filter:
    max_ring_size: 8
    max_heavy_atoms: 60
    min_heavy_atoms: 2
    desired_smarts:
      - "[C](=[O])-[N]"
      - "c1ccccc1"
    require_all_desired: true

  # 分子性質目標 (target_spec)
  target_spec:
    ClogP:
      goal: maximize
    SAScore:
      goal: range
      low: 1.5
      high: 2.5
    MolWt:
      goal: range
      low: 380
      high: 470

  # 動態訓練資料：把「持續勝出」的合規分子直接同步進實際的訓練資料集
  dynamic_training_data:
    enabled: false
    max_pool_size: 10000

  # Front 1 分子的 CSV log 路徑，不填則預設存在 checkpoint.save_dir 底下的 front1_log.csv
  front1_log_path: null

  # 每一輪更新完 elite_archive 之後，archive 裡目前 pareto rank 前 5 層的分子快照
  # （每次覆蓋，不留存歷史），不填則預設存在 checkpoint.save_dir 底下的
  # elite_archive_log.csv
  elite_archive_log_path: null
